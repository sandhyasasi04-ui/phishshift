services:
  - type: web
    name: phishshift
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
